{% extends 'core/base.html' %}

{% block content %}
<div class="app-container">
    <div style="margin-bottom: 30px;">
        <h2 style="margin: 0; color: var(--text-main); font-size: 2rem;">Live Analytics Dashboard</h2>
        <p style="color: var(--text-muted); margin: 8px 0 0 0;">Interactive visualizations of student performance and attendance</p>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 30px;">
        <div class="card-light" style="padding: 20px;">
            <h3 class="card-title">Subject-wise Average Marks</h3>
            <div id="chart-bar" style="width: 100%; height: 350px;"></div>
        </div>
        <div class="card-light" style="padding: 20px;">
            <h3 class="card-title">Attendance Distribution</h3>
            <div id="chart-pie" style="width: 100%; height: 350px;"></div>
        </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
        <div class="card-light" style="padding: 20px;">
            <h3 class="card-title">Grade Distribution</h3>
            <div id="chart-histogram" style="width: 100%; height: 350px;"></div>
        </div>
        <div class="card-light" style="padding: 20px;">
            <h3 class="card-title">Marks vs Attendance</h3>
            <div id="chart-scatter" style="width: 100%; height: 350px;"></div>
        </div>
    </div>
</div>

<script>
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const bgColor = isDark ? '#1e293b' : '#ffffff';
    const textColor = isDark ? '#e2e8f0' : '#334155';
    const gridColor = isDark ? '#334155' : '#e2e8f0';

    const layoutBase = {
        paper_bgcolor: 'rgba(0,0,0,0)',
        plot_bgcolor: 'rgba(0,0,0,0)',
        font: { color: textColor, family: 'Segoe UI, sans-serif' },
        margin: { t: 20, r: 20, b: 50, l: 50 },
        xaxis: { gridcolor: gridColor },
        yaxis: { gridcolor: gridColor },
    };

    // Chart 1: Subject Average Marks (Bar)
    Plotly.newPlot('chart-bar', [{
        x: {{ subject_names|safe }},
        y: {{ subject_avgs|safe }},
        type: 'bar',
        marker: {
            color: ['#44899c', '#f59e0b', '#10b981', '#e74c3c', '#8b5cf6', '#ec4899'],
        },
    }], {
        ...layoutBase,
        xaxis: { ...layoutBase.xaxis, tickangle: -30 },
        yaxis: { ...layoutBase.yaxis, title: 'Average Marks' },
    }, { responsive: true });

    // Chart 2: Attendance Pie (donut per subject)
    const pieTraces = [];
    {% for label in att_labels %}
    pieTraces.push({
        values: [{{ att_present }}, {{ att_absent }}],
        labels: ['Present', 'Absent'],
        type: 'pie',
        hole: 0.45,
        name: '{{ label }}',
        marker: { colors: ['#10b981', '#e74c3c'] },
        domain: { row: 0, column: {{ forloop.counter0 }} },
        textinfo: 'percent',
        textfont: { size: 12 },
    });
    {% endfor %}

    Plotly.newPlot('chart-pie', pieTraces, {
        ...layoutBase,
        showlegend: true,
        annotations: [{ text: 'Attendance', font: { size: 14, color: textColor }, showarrow: false }],
    }, { responsive: true });

    // Chart 3: Grade Distribution (Histogram)
    Plotly.newPlot('chart-histogram', [{
        x: {{ grade_labels|safe }},
        y: {{ grade_values|safe }},
        type: 'bar',
        marker: {
            color: ['#10b981', '#34d399', '#6ee7b7', '#fbbf24', '#f59e0b', '#f97316', '#ef4444'],
        },
    }], {
        ...layoutBase,
        yaxis: { ...layoutBase.yaxis, title: 'Number of Students' },
    }, { responsive: true });

    // Chart 4: Scatter (Marks vs Attendance)
    Plotly.newPlot('chart-scatter', [{
        x: {{ scatter_x|safe }},
        y: {{ scatter_y|safe }},
        text: {{ scatter_text|safe }},
        mode: 'markers',
        type: 'scatter',
        marker: {
            size: 12,
            color: {{ scatter_y|safe }},
            colorscale: ['#ef4444', '#f59e0b', '#10b981'],
            showscale: true,
            colorbar: { title: 'Marks', tickfont: { color: textColor } },
        },
    }], {
        ...layoutBase,
        xaxis: { ...layoutBase.xaxis, title: 'Attendance %' },
        yaxis: { ...layoutBase.yaxis, title: 'Average Marks' },
        hovermode: 'closest',
    }, { responsive: true });
</script>
{% endblock %}
